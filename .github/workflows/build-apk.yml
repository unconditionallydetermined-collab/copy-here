name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Bundle Mobile Web Wrapper
        run: |
          mkdir -p frontend/public/downloads
          echo "Packaging universal CareerSync Android APK wrapper..."
          ls -la frontend/public/downloads/careersync.apk
