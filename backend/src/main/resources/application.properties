# ===== Supabase Configuration =====
supabase.url=${SUPABASE_URL:https://qbthhnmzjkjvyfpkuddu.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:your-supabase-anon-key}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:your-supabase-jwt-secret}

# ===== Gemini AI Configuration =====
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent}

# ===== File Storage Configuration =====
app.upload.dir=${UPLOAD_DIR:uploads}

# ===== Logging =====
logging.level.com.careersync=DEBUG
logging.level.org.springframework.security=INFO
# Suppress noisy MongoDB Atlas cluster monitor SSL handshake warnings
logging.level.org.mongodb.driver.cluster=ERROR
logging.level.org.mongodb.driver.connection=WARN

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
