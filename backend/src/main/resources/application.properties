# ===== Server Configuration =====
server.port=${PORT:8080}
server.servlet.context-path=/

# ===== Optional Local Config Import (ignored in git) =====
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# ===== MongoDB Configuration =====
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://unconditionallydetermined_db_user:CF5NU8REWRffit0Z@cluster0.hcsvcaf.mongodb.net/careersync?retryWrites=true&w=majority&appName=Cluster0}
spring.data.mongodb.database=${MONGODB_DATABASE:careersync}

# ===== File Upload Configuration =====
